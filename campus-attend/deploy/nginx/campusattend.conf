# CampusAttend Nginx Reverse Proxy Configuration
# Optimized for 100% Offline School Local Area Network (LAN) Operation

upstream fastapi_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name attendance.school.lan 192.168.1.100;

    # Redirect all plain HTTP traffic to secure HTTPS on LAN
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.school.lan 192.168.1.100;

    # Institutional Offline Self-Signed / Internal CA Certificate
    ssl_certificate /etc/ssl/campusattend/attendance.school.lan.crt;
    ssl_certificate_key /etc/ssl/campusattend/attendance.school.lan.key;

    # Secure SSL parameters (Offline LAN)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers (Defense in Depth)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max upload limit for bulk CSV student roster imports (e.g., 10MB)
    client_max_body_size 10M;

    # 1. Frontend Static Assets (Vite Production Build)
    root /var/www/campusattend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Cache static bundled chunks efficiently
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 2. Backend REST API Routing
    location /api/v1/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for future real-time broadcasts
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # LAN Timeout configurations
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Disable access logs for static assets to reduce disk I/O on older school PCs
    location = /favicon.ico { access_log off; log_not_found off; }
}
